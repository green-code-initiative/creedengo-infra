apiVersion: v1
kind: Secret
metadata:
  name: db
stringData:
  password: "${DB_PASSWORD}"
  api_key: "{{ .Values.apiKey }}"
  token: "vault:secret/data/app#token"
---
apiVersion: v1
kind: Pod
metadata: { name: app }
spec:
  containers:
    - name: app
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: password
---
AWSTemplateFormatVersion: "2010-09-09"
Resources:
  DB:
    Type: AWS::RDS::DBInstance
    Properties:
      MasterUserPassword: !Ref DBPassword

