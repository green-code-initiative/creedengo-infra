AWSTemplateFormatVersion: "2010-09-09"
Resources:
  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: m7g.large
      ImageId: ami-arm64
  WebDb:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t4g.medium
      Engine: postgres
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: demo

