apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          image: myorg/api:1.2.3
        - name: worker
          image: myorg/worker:1.2
          resources:
            requests:
              cpu: "100m"
---
apiVersion: v1
kind: Pod
metadata:
  name: solo
spec:
  containers:
    - name: solo
      image: myorg/solo:1
