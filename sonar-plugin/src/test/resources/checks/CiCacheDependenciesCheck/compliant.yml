name: ci
on:
  push:
  pull_request:
jobs:
  npm-with-builtin-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
  java-with-actions-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
      - run: ./mvnw verify
  opt-out:
    runs-on: self-hosted
    steps:
      - run: |
          # eco-design:ignore — persistent volumes already cache modules
          npm ci
  unrelated:
    runs-on: ubuntu-latest
    steps:
      - run: echo "no package manager touched"

