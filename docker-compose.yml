---
name: sonarqube_creedengo_infra

services:
  sonar:
    image: sonarqube:26.5.0.122743-community
    container_name: sonar_creedengo_infra
    ports:
      - "9000:9000"
    networks:
      - sonarnet
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      # Bind-mount the locally built plugin JAR into Sonar.
      # The pom.xml uses <finalName>creedengo-infra-plugin</finalName>
      # so this path is stable across versions and Git branches.
      # IMPORTANT : build the plugin first (`make build` or `./mvnw package -DskipTests`)
      # before `docker compose up`, otherwise Docker creates an empty
      # directory at this path and Sonar fails to read the plugin.
      - type: bind
      # NOTE: do NOT mount a named volume on /opt/sonarqube/extensions :
      # it would persist stale / partially-copied JARs between runs and
      # cause "Unable to read plugin manifest from jar" errors at startup.
        source: ./sonar-plugin/target/creedengo-infra-plugin-feature-rebase-on_eslint-SNAPSHOT.jar
        target: /opt/sonarqube/extensions/plugins/creedengo-infra-plugin-2.1.1-SNAPSHOT.jar
      - "logs:/opt/sonarqube/logs"
      - "data:/opt/sonarqube/data"
    healthcheck:
      test: 'host="$(hostname -i || echo ''127.0.0.1'')" && curl -sf http://$$host:9000/api/system/status | grep -qE ''"status":"(UP|DB_MIGRATION_REQUIRED|DB_MIGRATION_RUNNING|MIGRATION_SUCCEEDED)"'''
      interval: 10s
      timeout: 10s
      retries: 5

  db:
    image: postgres:17-alpine
    container_name: postgresql_creedengo_javascript
    networks:
      - sonarnet
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
      PGDATA: pg_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  sonarnet:
    driver: bridge

volumes:
  data:
  logs:
  pg_data:
