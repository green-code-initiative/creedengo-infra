apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          image: myorg/api@sha256:abc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits: # Noncompliant {{Set resources.limits.memory to prevent unbounded memory consumption and OOMKill cascades.}}
              cpu: "500m"