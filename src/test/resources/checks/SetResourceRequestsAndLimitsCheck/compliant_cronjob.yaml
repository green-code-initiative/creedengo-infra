apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: batch
              image: myorg/batch@sha256:abc
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"