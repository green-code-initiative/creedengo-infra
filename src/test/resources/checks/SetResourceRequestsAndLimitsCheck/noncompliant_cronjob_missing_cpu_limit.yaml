apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: batch
              image: myorg/batch@sha256:abc
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits: # Noncompliant {{Set resources.limits.cpu for batch workloads (Job/CronJob) to prevent runaway loops monopolising the node.}}
                  memory: "256Mi"